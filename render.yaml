services:
  - type: web
    name: shuati
    runtime: python
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
    # 免费套餐不能挂 persistent disk。若已在控制台加了磁盘，请自行设置 DATA_DIR 指向挂载路径。
